<!DOCTYPE html>
<html>
<head>
    <title>AI Log Anomaly Dashboard</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#f8fafc;
    font-size:42px;
}



h2{
    text-align:center;
    margin-top:40px;
    margin-bottom:20px;
    color:#e2e8f0;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    padding:25px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card:nth-child(1){
    background:#2563eb;
}

.card:nth-child(2){
    background:#dc2626;
}

.card:nth-child(3){
    background:#16a34a;
}

.card:nth-child(4){
    background:#9333ea;
}

.value{
    font-size:40px;
    font-weight:bold;
    margin-top:10px;
}

.chart-container{
    width:600px;
    max-width:100%;
    margin:20px auto;
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

#statsChart{
    max-height:400px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#1e293b;
    border-radius:12px;
    overflow:hidden;
    margin-top:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

th{
    background:#334155;
    color:white;
    padding:14px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #475569;
}

tr:hover{
    background:#273449;
}
.anomaly{
    color:#ef4444;
    font-weight:bold;
}

.normal{
    color:#22c55e;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🛡️ AI Log Anomaly Detection Dashboard</h1>


<div class="cards">

    <div class="card">
        <h3>Total Logs</h3>
        <div class="value" id="totalLogs">0</div>
    </div>

    <div class="card">
        <h3>Anomalies</h3>
        <div class="value" id="anomalies">0</div>
    </div>

    <div class="card">
        <h3>Normal Logs</h3>
        <div class="value" id="normalLogs">0</div>
    </div>
    <div class="card">
    <h3>Anomaly Rate</h3>
    <div class="value" id="anomalyRate">0%</div>
</div>

</div>

<h2>Log Statistics</h2>

<div class="chart-container">
    <canvas id="statsChart"></canvas>
</div>
<h2>Recent Detections</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Component</th>
            <th>Status</th>
            <th>Score</th>
            <th>Level</th>
            <th>Message</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>

<!-- Load Chart.js FIRST -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const API_URL = "";

let chart;

async function loadStats(){

    try{

        const response =
        await fetch("/stats");

        const data =
        await response.json();

        document.getElementById("totalLogs").innerText =
        data.total_logs;

        document.getElementById("anomalies").innerText =
        data.anomalies;

        document.getElementById("normalLogs").innerText =
        data.normal_logs;
        const rate =
     data.total_logs > 0
?
((data.anomalies / data.total_logs) * 100).toFixed(1)
:
0;

document.getElementById("anomalyRate").innerText =
rate + "%";

    }
    catch(error){

        console.error("Stats Error:", error);

    }
}

async function loadLogs(){

    try{

        const response =
        await fetch("/logs");

        const logs =
        await response.json();

        let html = "";

        logs.forEach(log => {

            html += `
            <tr>
                <td>${log.id}</td>
                <td>${log.component}</td>
                <td>
                ${
                  log.anomaly_status === "ANOMALY"
? '<span class="anomaly">🚨 ANOMALY</span>'
: '<span class="normal">✅ NORMAL</span>'
                }
                </td>
                <td>${log.anomaly_score}</td>
                <td>${log.level}</td>
                <td>${log.message}</td>
                <td>${log.log_date}</td>
            </tr>
            `;
        });

        document.getElementById("tableBody").innerHTML =
        html;

    }
    catch(error){

        console.error("Logs Error:", error);

    }
}

async function loadChart(){

    try{

        const response =
        await fetch("/stats");

        const data =
        await response.json();

        const ctx =
        document.getElementById("statsChart");

        if(chart){
            chart.destroy();
        }

        chart = new Chart(ctx, {

            type:"pie",

            data:{
                labels:[
                    "Anomalies",
                    "Normal Logs"
                ],

                datasets:[{
                    data:[
                        data.anomalies,
                        data.normal_logs
                    ],

                    backgroundColor:[
                        "#ef4444",
                        "#22c55e"
                    ]
                }]
            }
        });

    }
    catch(error){

        console.error(
            "Chart Error:",
            error
        );
    }
}

loadStats();
loadLogs();
loadChart();

setInterval(() => {

    loadStats();
    loadLogs();
    loadChart();

}, 5000);

</script>

</body>
</html>
