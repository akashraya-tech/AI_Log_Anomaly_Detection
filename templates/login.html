<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login -  AI_Log_Anomaly_Detection </title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-input: #070d19;
      --border-color: rgba(51, 65, 85, 0.6);
      --text-muted: #94a3b8;
      --text-heading: #f8fafc;
      --accent-blue: #38bdf8;
      --accent-red: #f43f5e;
      --accent-green: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px 22px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.35);
      margin-bottom: 10px;
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -0.01em;
    }

    .version-tag {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-weight: 600;
      margin-top: 4px;
    }

    .brand-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .error-banner {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      font-family: monospace;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent-blue);
    }

    .submit-btn {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .footer-status {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(51, 65, 85, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .dot-green {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }
  </style>
</head>

<body>
  <div class="login-box">
    <div class="brand-section">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <div class="brand-title">HDFS Anomaly Sentinel</div>
      <span class="version-tag">DevOps Engine v3</span>
      <p class="brand-desc">Sign in to access live log anomaly monitoring</p>
    </div>

    {% if error %}
    <div class="error-banner">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="admin"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="••••••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="submit-btn">
        Login to Dashboard
      </button>
    </form>

    <div class="footer-status">
      <span class="dot-green"></span>
      <span>AIVEN PG &amp; MODEL ACTIVE</span>
    </div>
  </div>
</body>
</html>
